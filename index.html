<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Beibo Sales Playbook</title>
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1d1d1b; --ink-2:#5b5a55; --ink-3:#8b8a84;
  --line:#e4e2dc; --accent:#9a5b2e; --accent-soft:#f3e7dc;
  --g:#1f7a4a; --g-bg:#e3f2e9; --y:#8a6400; --y-bg:#fbf0d2; --r:#b3261e; --r-bg:#fbe4e1;
  --mark:#ffe58a; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161614; --panel:#1f1f1c; --ink:#ecebe6; --ink-2:#b4b2aa; --ink-3:#85837c;
    --line:#33322e; --accent:#d99a68; --accent-soft:#3a2b1f;
    --g:#6fd39b; --g-bg:#1b3326; --y:#e8c36a; --y-bg:#3a3018; --r:#f08a80; --r-bg:#3e1f1c;
    --mark:#6b5a12; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#161614; --panel:#1f1f1c; --ink:#ecebe6; --ink-2:#b4b2aa; --ink-3:#85837c;
  --line:#33322e; --accent:#d99a68; --accent-soft:#3a2b1f;
  --g:#6fd39b; --g-bg:#1b3326; --y:#e8c36a; --y-bg:#3a3018; --r:#f08a80; --r-bg:#3e1f1c;
  --mark:#6b5a12; --shadow:none;
}
*{box-sizing:border-box}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
button,input,select{font:inherit;color:inherit}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top{max-width:1240px;margin:0 auto;padding:14px 20px 12px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.brand small{color:var(--ink-3);font-size:12.5px}
.searchrow{display:flex;gap:8px;align-items:center}
.search{flex:1;position:relative}
.search input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);
  padding:0 44px 0 42px;font-size:16px;outline:none;box-shadow:var(--shadow)}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search .kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ink-3);
  border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;
  font-size:20px;color:var(--ink-3);display:none;padding:4px 8px}
.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dot.g{background:var(--g)}.dot.y{background:#d4a017}.dot.r{background:var(--r)}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:250px 1fr;gap:28px;padding:20px}
nav{position:sticky;top:150px;align-self:start;max-height:calc(100vh - 170px);overflow:auto;padding-bottom:20px}
nav .sec{margin-bottom:6px}
nav .sec>button{width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:8px;cursor:pointer;
  font-weight:650;font-size:14px;display:flex;justify-content:space-between;align-items:center}
nav .sec>button:hover{background:var(--panel)}
nav .sec.active>button{background:var(--accent-soft);color:var(--accent)}
nav .sec>button .zh{font-weight:400;color:var(--ink-3);font-size:12.5px;margin-left:6px}
nav ul{list-style:none;margin:2px 0 6px;padding:0 0 0 12px;border-left:1px solid var(--line);margin-left:16px}
nav li a{display:flex;justify-content:space-between;gap:8px;padding:4px 8px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-size:13.5px}
nav li a:hover{background:var(--panel);color:var(--ink)}
nav li a .n{color:var(--ink-3);font-size:12px}
nav .sec:not(.active) ul{display:none}
.mnav{display:none}
.search.has-q .kbd{display:none}

main{min-width:0}
.crumb{color:var(--ink-3);font-size:13px;margin:0 0 4px}
h2.sectitle{font-size:24px;margin:0 0 18px;letter-spacing:-.015em}
h2.sectitle .zh{color:var(--ink-3);font-weight:400;font-size:18px;margin-left:8px}
h3.topic{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:30px 0 10px;font-weight:650}
h3.topic:first-of-type{margin-top:0}
h3.topic .zh{text-transform:none;letter-spacing:0;margin-left:6px;font-weight:400}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.card .head{display:flex;gap:10px;align-items:flex-start}
.card .title{flex:1;min-width:0}
.card .q{font-weight:650;font-size:15.5px}
.card .qz{color:var(--ink-2);font-size:14px}
.card .path{font-size:12px;color:var(--ink-3);margin-bottom:2px}
.badge{flex:none;font-size:12px;font-weight:650;border-radius:999px;padding:2px 10px;white-space:nowrap}
.badge.g{background:var(--g-bg);color:var(--g)}
.badge.y{background:var(--y-bg);color:var(--y)}
.badge.r{background:var(--r-bg);color:var(--r)}
.body{margin-top:10px;display:grid;gap:10px}
.lang{position:relative}
.lang .tag{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.05em;margin-bottom:2px}
.lang p{margin:0 0 6px}.lang p:last-child{margin-bottom:0}
.lang ul{margin:2px 0 6px;padding-left:20px}.lang li{margin:2px 0}
.mono{white-space:pre-wrap}
.note{font-size:13.5px;border-radius:8px;padding:8px 11px;background:var(--y-bg);color:var(--ink)}
.card.r .note{background:var(--r-bg)}
.actions{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.btn{border:1px solid var(--line);background:none;border-radius:8px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.done{color:var(--g);border-color:var(--g)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
body.lang-en .lang.zh, body.lang-zh .lang.en{display:none}
body.lang-en .qz, body.lang-zh .q{display:none}
body.lang-zh .card .qz{color:var(--ink);font-weight:650;font-size:15.5px}

.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center}
.empty p{margin:6px 0}
.empty .say{font-size:16px;font-weight:600;margin:12px 0}
.wa{display:inline-block;margin-top:10px;background:#1f8f4e;color:#fff;text-decoration:none;border-radius:10px;padding:9px 16px;font-weight:600}
.count{color:var(--ink-3);font-size:13px;margin:0 0 12px}
footer{color:var(--ink-3);font-size:12.5px;text-align:center;padding:30px 20px 40px}
footer a{color:inherit}

/* ---------- mobile ---------- */
@media (max-width:860px){
  html{scroll-padding-top:180px}
  .top{padding:10px 16px}
  .wrap{grid-template-columns:1fr;padding:14px 16px;gap:0}
  nav{display:none}
  .mnav{display:flex;gap:6px;overflow-x:auto;padding:0 0 2px;scrollbar-width:none}
  .mnav::-webkit-scrollbar{display:none}
  .search .kbd{display:none}
  .brand small{display:none}
  .brand h1{font-size:15px}
  .top{gap:8px}
  .controls{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .controls::-webkit-scrollbar{display:none}
  .search input{height:42px}
  h2.sectitle{font-size:21px}
  .msel{display:block;width:100%;margin:0 0 14px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
}
@media (min-width:861px){.msel{display:none}}
</style>
</head>
<body class="lang-both">
<header>
  <div class="top">
    <div class="brand">
      <h1>Beibo <span>Sales Playbook</span> · 贝博销售手册</h1>
      <small id="updated"></small>
    </div>
    <div class="searchrow">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" placeholder="Search anything · 搜索：price, 防爆, silo bag, Brazil…" aria-label="Search">
        <span class="kbd">/</span>
        <button class="clear" id="clear" aria-label="Clear search">×</button>
      </div>
    </div>
    <div class="controls">
      <button class="chip" data-light="all" aria-pressed="true">All</button>
      <button class="chip" data-light="g" aria-pressed="false"><span class="dot g"></span>Say it</button>
      <button class="chip" data-light="y" aria-pressed="false"><span class="dot y"></span>Numbers only</button>
      <button class="chip" data-light="r" aria-pressed="false"><span class="dot r"></span>Ask Zee</button>
      <span class="sep"></span>
      <button class="chip" data-lang="both" aria-pressed="true">EN + 中文</button>
      <button class="chip" data-lang="en" aria-pressed="false">EN</button>
      <button class="chip" data-lang="zh" aria-pressed="false">中文</button>
    </div>
    <div class="mnav" id="mnav"></div>
  </div>
</header>

<div class="wrap">
  <nav id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<footer>
  🟢 say it · 🟡 say only the exact numbers shown · 🔴 don't answer, say <em>“Let me confirm with our engineering team and come back to you today”</em> and ask Zee.<br>
  Not in the playbook = 🔴. Content lives in <code>content.js</code>.
</footer>

<script src="content.js"></script>
<script>
(function(){
  const P = window.PLAYBOOK;
  const $ = s => document.querySelector(s);
  const LIGHT = {g:"Say it · 可直接说", y:"Numbers only · 只说写明数字", r:"Ask Zee · 问 Zee"};
  const state = {section: P.sections[0].id, light: "all", lang: "both", q: ""};

  // Flatten for search
  const all = [];
  P.sections.forEach(s => s.topics.forEach(t => t.items.forEach(it => {
    all.push({s, t, it, hay: norm([it.q, it.qz, it.keys, it.en, it.zh, it.note, t.title, t.zh].join(" ")),
              head: norm([it.q, it.qz, it.keys].join(" "))});
  })));

  $("#updated").textContent = "Updated " + P.updated + " · owner " + P.owner;

  function norm(s){ return (s||"").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,""); }
  function esc(s){ return (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
  function inline(s){
    return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[\s(])\*(?!\s)(.+?)\*(?=[\s).,]|$)/g,"$1<em>$2</em>");
  }
  function fmt(text){
    if(!text) return "";
    const blocks = text.split(/\n\s*\n/);
    return blocks.map(b => {
      const lines = b.split("\n");
      let html = "", list = [];
      const flush = () => { if(list.length){ html += "<ul>" + list.map(l => "<li>"+inline(l)+"</li>").join("") + "</ul>"; list = []; } };
      lines.forEach(l => {
        if(/^\s*- /.test(l)) list.push(l.replace(/^\s*- /,""));
        else { flush(); if(l.trim()) html += "<p>"+inline(l)+"</p>"; }
      });
      flush();
      return html;
    }).join("");
  }
  const isTemplate = it => !it.zh && it.en && !it.light;

  function card(entry, showPath){
    const {s, t, it} = entry;
    const L = it.light;
    const el = document.createElement("article");
    el.className = "card" + (L ? " " + L : "");
    const mono = isTemplate(it) && /\n/.test(it.en) ? " mono" : "";
    el.innerHTML =
      '<div class="head"><div class="title">' +
        (showPath ? '<div class="path">' + esc(s.title) + ' › ' + esc(t.title) + '</div>' : '') +
        '<div class="q">' + inline(it.q) + '</div>' +
        (it.qz ? '<div class="qz">' + esc(it.qz) + '</div>' : '') +
      '</div>' + (L ? '<span class="badge ' + L + '">' + (L==="g"?"🟢 ":L==="y"?"🟡 ":"🔴 ") + LIGHT[L] + '</span>' : '') + '</div>' +
      '<div class="body">' +
        (it.en ? '<div class="lang en' + (it.zh ? '' : ' always') + '"><div class="tag">EN</div><div class="' + mono.trim() + '">' + (mono ? esc(it.en) : fmt(it.en)) + '</div></div>' : '') +
        (it.zh ? '<div class="lang zh"><div class="tag">中文</div>' + fmt(it.zh) + '</div>' : '') +
        (it.note ? '<div class="note">⚠️ ' + inline(it.note) + '</div>' : '') +
      '</div>' +
      '<div class="actions">' +
        (it.en ? '<button class="btn" data-copy="en">Copy EN</button>' : '') +
        (it.zh ? '<button class="btn" data-copy="zh">复制中文</button>' : '') +
      '</div>';
    // Templates with no Chinese stay visible in 中文 mode
    const alw = el.querySelector(".lang.always"); if(alw) alw.classList.remove("en");
    el.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => {
      const txt = (b.dataset.copy === "en" ? it.en : it.zh).replace(/\*\*(.+?)\*\*/g,"$1");
      navigator.clipboard.writeText(txt).then(() => {
        const old = b.textContent; b.textContent = "Copied ✓"; b.classList.add("done");
        setTimeout(() => { b.textContent = old; b.classList.remove("done"); }, 1400);
      });
    }));
    return el;
  }

  function lightOk(it){ return state.light === "all" || it.light === state.light; }

  function highlight(root, terms){
    if(!terms.length) return;
    const re = new RegExp("(" + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|") + ")", "gi");
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = []; while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n => {
      if(!re.test(n.nodeValue)) return; re.lastIndex = 0;
      const span = document.createElement("span");
      span.innerHTML = esc(n.nodeValue).replace(re, "<mark>$1</mark>");
      n.replaceWith(...span.childNodes);
    });
  }

  function renderNav(){
    const nav = $("#nav"); nav.innerHTML = "";
    const mnav = $("#mnav"); mnav.innerHTML = "";
    P.sections.forEach(s => {
      const n = s.topics.reduce((a,t) => a + t.items.length, 0);
      const d = document.createElement("div");
      d.className = "sec" + (s.id === state.section && !state.q ? " active" : "");
      d.innerHTML = '<button><span>' + esc(s.title) + '<span class="zh">' + esc(s.zh) + '</span></span><span class="n" style="color:var(--ink-3);font-weight:400;font-size:12px">' + n + '</span></button>' +
        '<ul>' + s.topics.map(t => '<li><a href="#' + s.id + '/' + t.id + '"><span>' + esc(t.title) + '</span><span class="n">' + t.items.length + '</span></a></li>').join("") + '</ul>';
      d.querySelector("button").addEventListener("click", () => go(s.id));
      d.querySelectorAll("a").forEach(a => a.addEventListener("click", e => {
        e.preventDefault(); const [sid, tid] = a.getAttribute("href").slice(1).split("/"); go(sid, tid);
      }));
      nav.appendChild(d);
      const c = document.createElement("button");
      c.className = "chip"; c.setAttribute("aria-pressed", s.id === state.section && !state.q ? "true" : "false");
      c.textContent = s.title + " · " + s.zh;
      c.addEventListener("click", () => go(s.id));
      mnav.appendChild(c);
    });
  }

  function go(sid, tid){
    state.section = sid;
    if(state.q){ $("#q").value = ""; state.q = ""; $("#clear").style.display = "none"; $(".search").classList.remove("has-q"); }
    history.replaceState(null, "", "#" + sid + (tid ? "/" + tid : ""));
    render();
    if(tid){ const el = document.getElementById("t-" + tid); if(el) el.scrollIntoView(); }
    else window.scrollTo(0, 0);
  }

  function renderSection(){
    const s = P.sections.find(x => x.id === state.section) || P.sections[0];
    const main = $("#main"); main.innerHTML = "";
    const h = document.createElement("h2"); h.className = "sectitle";
    h.innerHTML = esc(s.title) + '<span class="zh">' + esc(s.zh) + '</span>';
    main.appendChild(h);
    const sel = document.createElement("select"); sel.className = "msel"; sel.setAttribute("aria-label","Jump to topic");
    sel.innerHTML = '<option value="">Jump to topic · 跳转…</option>' + s.topics.map(t => '<option value="' + t.id + '">' + esc(t.title) + ' · ' + esc(t.zh) + '</option>').join("");
    sel.addEventListener("change", () => { const el = document.getElementById("t-" + sel.value); if(el) el.scrollIntoView(); });
    main.appendChild(sel);
    let shown = 0;
    s.topics.forEach(t => {
      const items = t.items.filter(lightOk);
      if(!items.length) return;
      const th = document.createElement("h3"); th.className = "topic"; th.id = "t-" + t.id;
      th.innerHTML = esc(t.title) + '<span class="zh">' + esc(t.zh) + '</span>';
      main.appendChild(th);
      items.forEach(it => { main.appendChild(card({s, t, it}, false)); shown++; });
    });
    if(!shown) main.insertAdjacentHTML("beforeend", '<p class="count">Nothing in this section matches the filter.</p>');
  }

  function renderSearch(){
    const main = $("#main"); main.innerHTML = "";
    const qn = norm(state.q).trim();
    const terms = qn.split(/\s+/).filter(Boolean);
    let hits = all.filter(e => lightOk(e.it) && terms.every(t => e.hay.includes(t)));
    if(!hits.length) hits = all.filter(e => lightOk(e.it) && terms.some(t => t.length > 1 && e.hay.includes(t)));
    hits = hits.map(e => {
      let sc = 0;
      terms.forEach(t => { if(e.head.includes(t)) sc += 3; if(e.hay.includes(t)) sc += 1; });
      if(e.head.includes(qn)) sc += 4;
      return {e, sc};
    }).sort((a,b) => b.sc - a.sc).map(x => x.e);

    if(!hits.length){
      const wa = "https://wa.me/" + P.whatsapp + "?text=" + encodeURIComponent("[Playbook] Client asked: " + state.q);
      main.innerHTML = '<div class="empty"><p><strong>Not in the playbook, so treat it as 🔴.</strong> 手册里没有 = 🔴</p>' +
        '<p class="say">“Let me confirm with our engineering team and come back to you today.”</p>' +
        '<p>“我跟工程团队确认后今天回复您。”</p>' +
        '<a class="wa" href="' + wa + '" target="_blank" rel="noopener">Ask Zee on WhatsApp</a></div>';
      return;
    }
    main.insertAdjacentHTML("beforeend", '<p class="count">' + hits.length + ' result' + (hits.length>1?"s":"") + ' for “' + esc(state.q) + '”</p>');
    hits.forEach(e => main.appendChild(card(e, true)));
    highlight(main, terms.filter(t => t.length > 1 || /[一-鿿]/.test(t)));
  }

  function render(){
    renderNav();
    state.q ? renderSearch() : renderSection();
  }

  // Events
  const qi = $("#q");
  let timer;
  qi.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => { state.q = qi.value.trim(); $("#clear").style.display = state.q ? "block" : "none"; $(".search").classList.toggle("has-q", !!state.q); render(); window.scrollTo(0,0); }, 80);
  });
  $("#clear").addEventListener("click", () => { qi.value = ""; state.q = ""; $("#clear").style.display = "none"; $(".search").classList.remove("has-q"); render(); qi.focus(); });
  document.addEventListener("keydown", e => {
    if(e.key === "/" && document.activeElement !== qi){ e.preventDefault(); qi.focus(); qi.select(); }
    if(e.key === "Escape" && document.activeElement === qi){ qi.value = ""; state.q = ""; $("#clear").style.display = "none"; $(".search").classList.remove("has-q"); render(); }
  });
  document.querySelectorAll("[data-light]").forEach(b => b.addEventListener("click", () => {
    state.light = b.dataset.light;
    document.querySelectorAll("[data-light]").forEach(x => x.setAttribute("aria-pressed", x === b));
    render();
  }));
  document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
    state.lang = b.dataset.lang;
    document.body.className = "lang-" + state.lang;
    document.querySelectorAll("[data-lang]").forEach(x => x.setAttribute("aria-pressed", x === b));
    try{ localStorage.setItem("pb-lang", state.lang); }catch(e){}
  }));
  try{ const l = localStorage.getItem("pb-lang"); if(l){ const b = document.querySelector('[data-lang="'+l+'"]'); if(b) b.click(); } }catch(e){}

  // Initial route
  const [sid, tid] = location.hash.slice(1).split("/");
  if(sid && P.sections.some(s => s.id === sid)) state.section = sid;
  render();
  if(tid){ const el = document.getElementById("t-" + tid); if(el) el.scrollIntoView(); }
})();
</script>
</body>
</html>
